name: generate arcade contribution graphs

on:
  schedule: # roda sozinho todo dia
    - cron: '0 3 * * *'
  workflow_dispatch: # botão "Run workflow" manual
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # opções: pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper
          games: 'breakout,pacman'
          hide_month_labels: 'false'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
